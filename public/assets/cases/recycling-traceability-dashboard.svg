<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Recycling traceability audit dashboard</title>
  <desc id="desc">A public-facing dashboard mockup showing AIoT recycling traceability, YOLO evidence review, batch status, material recovery, and audit export readiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="0.5" stop-color="#edf7f2"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#103048" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="980" cy="96" r="148" fill="#dff3ec" opacity="0.8"/>
  <circle cx="122" cy="592" r="170" fill="#e8effd" opacity="0.86"/>

  <g transform="translate(58 48)" font-family="Inter, Noto Sans TC, Arial, sans-serif">
    <text x="0" y="0" fill="#102033" font-size="27" font-weight="850">Recycling Traceability Dashboard</text>
    <text x="0" y="34" fill="#425668" font-size="16" font-weight="650">Review AI detection evidence, batch history, material recovery, and audit export readiness in one workspace.</text>
  </g>

  <g transform="translate(62 118)" filter="url(#shadow)" font-family="Inter, Noto Sans TC, Arial, sans-serif">
    <rect width="1076" height="498" rx="32" fill="#ffffff" stroke="#d8e9ee"/>
    <rect width="1076" height="74" rx="32" fill="url(#dark)"/>
    <rect y="42" width="1076" height="32" fill="url(#dark)"/>
    <text x="32" y="45" fill="#ffffff" font-size="18" font-weight="850">AIoT Recycling Evidence</text>
    <text x="258" y="45" fill="#9db0c5" font-size="13" font-weight="700">Batch PV-REC-2409-18</text>
    <rect x="858" y="20" width="166" height="34" rx="17" fill="#dff6f2"/>
    <circle cx="882" cy="37" r="6" fill="#2a9d8f"/>
    <text x="900" y="42" fill="#1f6f67" font-size="13" font-weight="850">Audit ready</text>

    <g transform="translate(30 104)">
      <rect width="250" height="156" rx="22" fill="#102033"/>
      <text x="22" y="34" fill="#ffffff" font-size="15" font-weight="850">YOLO Evidence Review</text>
      <rect x="22" y="54" width="206" height="76" rx="14" fill="#dff6f2"/>
      <path d="M38 112 L75 76 L102 100 L128 68 L204 112 Z" fill="#76d8b8"/>
      <rect x="54" y="72" width="72" height="34" rx="8" fill="none" stroke="#9fb29d" stroke-width="3"/>
      <rect x="146" y="82" width="52" height="28" rx="8" fill="none" stroke="#4fb7a9" stroke-width="3"/>
      <text x="22" y="142" fill="#6b7e8f" font-size="12" font-weight="700">Detected: module, frame, glass</text>
    </g>

    <g transform="translate(308 104)">
      <rect width="218" height="156" rx="22" fill="#f7fbfc" stroke="#d8e9ee"/>
      <text x="22" y="34" fill="#102033" font-size="15" font-weight="850">Batch Status</text>
      <text x="22" y="74" fill="#2a9d8f" font-size="34" font-weight="900">84%</text>
      <text x="92" y="76" fill="#425668" font-size="12" font-weight="700">records complete</text>
      <rect x="22" y="106" width="174" height="12" rx="6" fill="#e8f3ff"/>
      <rect x="22" y="106" width="146" height="12" rx="6" fill="url(#brand)"/>
      <text x="22" y="140" fill="#425668" font-size="12" font-weight="700">5 checkpoints verified</text>
    </g>

    <g transform="translate(554 104)">
      <rect width="218" height="156" rx="22" fill="#f7fbfc" stroke="#d8e9ee"/>
      <text x="22" y="34" fill="#102033" font-size="15" font-weight="850">Material Recovery</text>
      <circle cx="76" cy="92" r="38" fill="none" stroke="#e8f3ff" stroke-width="12"/>
      <path d="M76 54 A38 38 0 1 1 44 112" fill="none" stroke="#2a9d8f" stroke-width="12" stroke-linecap="round"/>
      <text x="58" y="98" fill="#102033" font-size="18" font-weight="900">71</text>
      <text x="116" y="82" fill="#425668" font-size="12" font-weight="700">recovered</text>
      <text x="116" y="104" fill="#425668" font-size="12" font-weight="700">materials</text>
      <text x="22" y="140" fill="#425668" font-size="12" font-weight="700">Glass, metal, silicon stream</text>
    </g>

    <g transform="translate(800 104)">
      <rect width="246" height="156" rx="22" fill="#f7fbfc" stroke="#d8e9ee"/>
      <text x="22" y="34" fill="#102033" font-size="15" font-weight="850">Trust Chain</text>
      <rect x="22" y="60" width="96" height="26" rx="13" fill="#dff6f2"/>
      <text x="42" y="78" fill="#1f6f67" font-size="11" font-weight="850">Anchored</text>
      <text x="22" y="112" fill="#425668" font-size="12" font-weight="700">Evidence hash, reviewer state,</text>
      <text x="22" y="134" fill="#425668" font-size="12" font-weight="700">and export log connected.</text>
    </g>

    <g transform="translate(30 292)">
      <rect width="494" height="154" rx="22" fill="#f7fbfc" stroke="#d8e9ee"/>
      <text x="22" y="34" fill="#102033" font-size="15" font-weight="850">Traceability Timeline</text>
      <line x1="44" y1="78" x2="432" y2="78" stroke="#cbd8e6" stroke-width="5" stroke-linecap="round"/>
      <g>
        <circle cx="54" cy="78" r="12" fill="#2a9d8f"/>
        <circle cx="164" cy="78" r="12" fill="#2a9d8f"/>
        <circle cx="274" cy="78" r="12" fill="#2f80ed"/>
        <circle cx="384" cy="78" r="12" fill="#4fb7a9"/>
      </g>
      <text x="28" y="118" fill="#425668" font-size="12" font-weight="750">Capture</text>
      <text x="134" y="118" fill="#425668" font-size="12" font-weight="750">Detect</text>
      <text x="244" y="118" fill="#425668" font-size="12" font-weight="750">Batch</text>
      <text x="354" y="118" fill="#425668" font-size="12" font-weight="750">Export</text>
    </g>

    <g transform="translate(554 292)">
      <rect width="492" height="154" rx="22" fill="#102033"/>
      <text x="24" y="36" fill="#ffffff" font-size="15" font-weight="850">Audit Export Preview</text>
      <rect x="24" y="60" width="126" height="22" rx="11" fill="#dff6f2"/>
      <text x="42" y="76" fill="#9fb29d" font-size="11" font-weight="850">Evidence packet</text>
      <rect x="24" y="102" width="206" height="10" rx="5" fill="#4d6078"/>
      <rect x="24" y="126" width="156" height="10" rx="5" fill="#4d6078"/>
      <rect x="304" y="58" width="132" height="72" rx="16" fill="#ffffff" opacity="0.1"/>
      <path d="M332 96 H408 M370 72 V120" stroke="#9fb29d" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
