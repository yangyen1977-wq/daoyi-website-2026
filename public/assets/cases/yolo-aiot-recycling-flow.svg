<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">YOLO AIoT recycling traceability flow</title>
  <desc id="desc">A public-facing process diagram showing how field image recognition, equipment signals, batch records, traceability ledger, and audit dashboard connect for recycling evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="0.48" stop-color="#eef7f4"/>
      <stop offset="1" stop-color="#f7f3ea"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f8b8d"/>
      <stop offset="1" stop-color="#2f6fdd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f2942" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2f6fdd"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1005" cy="88" r="128" fill="#d9efe9" opacity="0.7"/>
  <circle cx="134" cy="590" r="166" fill="#e8eefc" opacity="0.82"/>

  <g transform="translate(64 54)">
    <text x="0" y="0" fill="#102033" font-family="Inter, Noto Sans TC, Arial, sans-serif" font-size="25" font-weight="800">AIoT Recycling Traceability Flow</text>
    <text x="0" y="36" fill="#4f6074" font-family="Inter, Noto Sans TC, Arial, sans-serif" font-size="16" font-weight="600">YOLO detection, field signals, batch records, and audit-ready evidence connected in one trust chain.</text>
  </g>

  <g transform="translate(76 126)" filter="url(#shadow)">
    <rect width="1048" height="410" rx="28" fill="url(#panel)" stroke="#d9e3ef"/>
  </g>

  <g font-family="Inter, Noto Sans TC, Arial, sans-serif">
    <g transform="translate(116 176)">
      <rect width="170" height="280" rx="22" fill="#102033"/>
      <rect x="20" y="26" width="130" height="82" rx="12" fill="#213650"/>
      <rect x="38" y="42" width="94" height="50" rx="8" fill="#2d855f"/>
      <path d="M44 80 L72 55 L92 72 L108 52 L126 80 Z" fill="#82d8b8"/>
      <rect x="30" y="130" width="110" height="10" rx="5" fill="#75e0cf"/>
      <rect x="30" y="154" width="86" height="10" rx="5" fill="#64748b"/>
      <rect x="30" y="178" width="104" height="10" rx="5" fill="#64748b"/>
      <text x="26" y="230" fill="#ffffff" font-size="18" font-weight="800">Field Capture</text>
      <text x="26" y="258" fill="#b8c7d9" font-size="13" font-weight="600">Image + device signal</text>
    </g>

    <path d="M310 316 H392" stroke="#2f6fdd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(404 176)">
      <rect width="176" height="280" rx="22" fill="#ffffff" stroke="#d7e2ef"/>
      <rect x="22" y="26" width="132" height="82" rx="14" fill="#eff8f4"/>
      <rect x="45" y="48" width="86" height="38" rx="8" fill="none" stroke="#0f8b8d" stroke-width="3"/>
      <circle cx="56" cy="59" r="5" fill="#0f8b8d"/>
      <circle cx="119" cy="75" r="5" fill="#0f8b8d"/>
      <text x="22" y="144" fill="#102033" font-size="18" font-weight="800">YOLO Detection</text>
      <text x="22" y="174" fill="#4f6074" font-size="13" font-weight="650">Object, defect, weight,</text>
      <text x="22" y="194" fill="#4f6074" font-size="13" font-weight="650">stage, confidence</text>
      <rect x="22" y="222" width="76" height="28" rx="14" fill="#dff4ef"/>
      <text x="41" y="242" fill="#0c726f" font-size="12" font-weight="800">AI log</text>
    </g>

    <path d="M604 316 H686" stroke="#2f6fdd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(698 176)">
      <rect width="176" height="280" rx="22" fill="#ffffff" stroke="#d7e2ef"/>
      <rect x="22" y="28" width="132" height="76" rx="14" fill="#eef3ff"/>
      <path d="M48 80 V56 H78 V80 M78 68 H108 V80 M108 50 H138 V80" stroke="#2f6fdd" stroke-width="5" stroke-linecap="round" fill="none"/>
      <text x="22" y="144" fill="#102033" font-size="18" font-weight="800">Batch Evidence</text>
      <text x="22" y="174" fill="#4f6074" font-size="13" font-weight="650">Material, process,</text>
      <text x="22" y="194" fill="#4f6074" font-size="13" font-weight="650">operator, timestamp</text>
      <rect x="22" y="222" width="94" height="28" rx="14" fill="#e3ebff"/>
      <text x="41" y="242" fill="#2858bd" font-size="12" font-weight="800">Batch ID</text>
    </g>

    <path d="M898 316 H980" stroke="#2f6fdd" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(992 176)">
      <rect width="96" height="280" rx="22" fill="#0f8b8d"/>
      <rect x="22" y="32" width="52" height="52" rx="14" fill="#ffffff" opacity="0.18"/>
      <path d="M34 58 H62 M48 44 V72" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <text x="22" y="130" fill="#ffffff" font-size="16" font-weight="800">Audit</text>
      <text x="22" y="154" fill="#ffffff" font-size="16" font-weight="800">Ready</text>
      <text x="22" y="198" fill="#d8fffa" font-size="12" font-weight="700">Dashboard</text>
      <text x="22" y="218" fill="#d8fffa" font-size="12" font-weight="700">API</text>
      <text x="22" y="238" fill="#d8fffa" font-size="12" font-weight="700">Report</text>
    </g>
  </g>

  <g transform="translate(178 504)" font-family="Inter, Noto Sans TC, Arial, sans-serif">
    <rect width="844" height="86" rx="22" fill="#ffffff" stroke="#d9e3ef" filter="url(#shadow)"/>
    <rect x="28" y="28" width="110" height="30" rx="15" fill="url(#accent)"/>
    <text x="50" y="49" fill="#ffffff" font-size="13" font-weight="850">Trust Chain</text>
    <text x="172" y="35" fill="#102033" font-size="15" font-weight="800">Traceability ledger links every field event to verifiable recycling history.</text>
    <text x="172" y="61" fill="#4f6074" font-size="13" font-weight="650">Hash anchors, permissioned records, and review states make evidence easier to audit without exposing internal project details.</text>
  </g>
</svg>
