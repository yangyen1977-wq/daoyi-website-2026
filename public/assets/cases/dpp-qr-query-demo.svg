<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DPP QR query demo</title>
  <desc id="desc">A public-facing mockup showing a QR scan leading to a digital product passport query page with product identity, material data, supply chain status, recycling guidance, and verification state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ef"/>
      <stop offset="0.52" stop-color="#f1eee6"/>
      <stop offset="1" stop-color="#f6f2e9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f8f83"/>
      <stop offset="1" stop-color="#5f758f"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3431"/>
      <stop offset="1" stop-color="#1f2524"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#13243a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1036" cy="104" r="144" fill="#ddf1eb" opacity="0.8"/>
  <circle cx="116" cy="582" r="170" fill="#e8effd" opacity="0.85"/>

  <g font-family="Inter, Noto Sans TC, Arial, sans-serif">
    <text x="68" y="76" fill="#252b29" font-size="28" font-weight="850">DPP QR Query Experience</text>
    <text x="68" y="111" fill="#6b716a" font-size="16" font-weight="650">Scan a product QR code and inspect product identity, material facts, recycling guidance, and trust status.</text>
  </g>

  <g transform="translate(70 152)" filter="url(#shadow)">
    <rect width="236" height="386" rx="34" fill="url(#phone)"/>
    <rect x="22" y="30" width="192" height="326" rx="24" fill="#f8fbff"/>
    <rect x="80" y="14" width="76" height="8" rx="4" fill="#2e4059"/>
    <text x="46" y="68" fill="#252b29" font-family="Inter, Noto Sans TC, Arial, sans-serif" font-size="15" font-weight="850">Scan Product QR</text>
    <rect x="50" y="92" width="136" height="136" rx="18" fill="#ffffff" stroke="#d8d5c9"/>
    <g fill="#252b29">
      <rect x="68" y="110" width="34" height="34" rx="4"/>
      <rect x="76" y="118" width="18" height="18" fill="#ffffff"/>
      <rect x="134" y="110" width="34" height="34" rx="4"/>
      <rect x="142" y="118" width="18" height="18" fill="#ffffff"/>
      <rect x="68" y="176" width="34" height="34" rx="4"/>
      <rect x="76" y="184" width="18" height="18" fill="#ffffff"/>
      <rect x="112" y="116" width="10" height="10"/>
      <rect x="112" y="138" width="18" height="10"/>
      <rect x="86" y="154" width="12" height="12"/>
      <rect x="112" y="160" width="12" height="24"/>
      <rect x="134" y="158" width="10" height="10"/>
      <rect x="152" y="158" width="10" height="24"/>
      <rect x="112" y="198" width="22" height="10"/>
      <rect x="146" y="194" width="18" height="18"/>
    </g>
    <rect x="50" y="252" width="136" height="34" rx="17" fill="url(#brand)"/>
    <text x="80" y="274" fill="#ffffff" font-family="Inter, Noto Sans TC, Arial, sans-serif" font-size="13" font-weight="850">Open Passport</text>
    <text x="52" y="318" fill="#6b716a" font-family="Inter, Noto Sans TC, Arial, sans-serif" font-size="12" font-weight="650">Product ID</text>
    <text x="52" y="338" fill="#252b29" font-family="Inter, Noto Sans TC, Arial, sans-serif" font-size="14" font-weight="850">DPP-2026-0148</text>
  </g>

  <g transform="translate(340 144)" filter="url(#shadow)" font-family="Inter, Noto Sans TC, Arial, sans-serif">
    <rect width="790" height="414" rx="30" fill="#ffffff" stroke="#d9e3ef"/>
    <rect x="28" y="28" width="734" height="76" rx="22" fill="#f1f7fb"/>
    <rect x="52" y="48" width="44" height="36" rx="10" fill="#252b29"/>
    <path d="M62 73 L72 60 L82 70 L90 56" stroke="#9fb29d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="59" fill="#252b29" font-size="21" font-weight="850">Digital Product Passport</text>
    <text x="118" y="86" fill="#6b716a" font-size="13" font-weight="700">Public query page for product facts, lifecycle records, and verification state</text>
    <rect x="612" y="49" width="124" height="34" rx="17" fill="#e6eadf"/>
    <circle cx="635" cy="66" r="6" fill="#6f8f83"/>
    <text x="652" y="71" fill="#4f675c" font-size="13" font-weight="850">Verified</text>

    <g transform="translate(36 132)">
      <rect width="226" height="218" rx="20" fill="#252b29"/>
      <text x="24" y="42" fill="#ffffff" font-size="18" font-weight="850">Product Identity</text>
      <text x="24" y="76" fill="#c9c5b7" font-size="12" font-weight="700">Category</text>
      <text x="24" y="98" fill="#ffffff" font-size="15" font-weight="800">Circular Product</text>
      <text x="24" y="132" fill="#c9c5b7" font-size="12" font-weight="700">Passport ID</text>
      <text x="24" y="154" fill="#ffffff" font-size="15" font-weight="800">DPP-2026-0148</text>
      <rect x="24" y="174" width="104" height="26" rx="13" fill="#3a4440"/>
      <text x="41" y="192" fill="#9fb29d" font-size="11" font-weight="850">QR linked</text>
    </g>

    <g transform="translate(286 132)">
      <rect width="210" height="102" rx="18" fill="#f8f6ef" stroke="#d9e3ef"/>
      <text x="22" y="34" fill="#252b29" font-size="15" font-weight="850">Material Facts</text>
      <rect x="22" y="54" width="66" height="10" rx="5" fill="#6f8f83"/>
      <rect x="22" y="76" width="142" height="10" rx="5" fill="#dbe6f3"/>
      <text x="122" y="64" fill="#6b716a" font-size="12" font-weight="750">BOM ready</text>
      <rect y="124" width="210" height="94" rx="18" fill="#f8f6ef" stroke="#d9e3ef"/>
      <text x="22" y="158" fill="#252b29" font-size="15" font-weight="850">Recycling Guidance</text>
      <text x="22" y="187" fill="#6b716a" font-size="12" font-weight="700">Disassembly, return path,</text>
      <text x="22" y="207" fill="#6b716a" font-size="12" font-weight="700">and recovery notes</text>
    </g>

    <g transform="translate(520 132)">
      <rect width="218" height="218" rx="20" fill="#f8f6ef" stroke="#d9e3ef"/>
      <text x="24" y="38" fill="#252b29" font-size="15" font-weight="850">Trust Timeline</text>
      <line x1="42" y1="70" x2="42" y2="176" stroke="#cbd8e6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="42" cy="72" r="10" fill="#6f8f83"/>
      <circle cx="42" cy="124" r="10" fill="#5f758f"/>
      <circle cx="42" cy="176" r="10" fill="#b8793d"/>
      <text x="68" y="78" fill="#252b29" font-size="12" font-weight="850">Data submitted</text>
      <text x="68" y="130" fill="#252b29" font-size="12" font-weight="850">Record checked</text>
      <text x="68" y="182" fill="#252b29" font-size="12" font-weight="850">Audit export</text>
      <rect x="24" y="196" width="126" height="1" fill="#d9e3ef"/>
    </g>
  </g>

  <g transform="translate(378 578)" font-family="Inter, Noto Sans TC, Arial, sans-serif">
    <rect width="444" height="48" rx="24" fill="#ffffff" stroke="#d9e3ef" filter="url(#shadow)"/>
    <rect x="20" y="13" width="86" height="22" rx="11" fill="url(#brand)"/>
    <text x="38" y="29" fill="#ffffff" font-size="11" font-weight="850">Evidence</text>
    <text x="126" y="30" fill="#252b29" font-size="13" font-weight="800">Public demo mockup. No internal project data exposed.</text>
  </g>
</svg>
